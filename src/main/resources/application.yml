server:
  port: 8080

spring:
  application:
    name: repair-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # createDatabaseIfNotExist=true：首次启动自动创建 repair_system 库
    url: jdbc:mysql://localhost:3306/repair_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql}
  sql:
    init:
      # 每次启动执行建表脚本（脚本内为 CREATE TABLE IF NOT EXISTS，幂等）
      mode: always
      schema-locations: classpath:sql/schema.sql
      encoding: UTF-8
      continue-on-error: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

logging:
  charset:
    console: UTF-8   # 缓解 Windows GBK 控制台中文乱码

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 生产环境务必通过环境变量 JWT_SECRET 覆盖，长度不少于 32 字节
  secret: ${JWT_SECRET:repair-system-dev-secret-key-please-change-in-production-0123456789}
  # token 有效期（秒），默认 7 天
  expire-seconds: 604800

app:
  cors:
    # 开发期放开跨域，上线收紧为具体前端域名（逗号分隔）
    allowed-origin-patterns: "*"
